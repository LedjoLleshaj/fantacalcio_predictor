[project]
name = "fantabeto"
version = "0.1.0"
description = "ML predictor for Serie A Fantacalcio player performances"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.1",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "tensorflow>=2.16,<2.18",
    "matplotlib>=3.9",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8.2"]
